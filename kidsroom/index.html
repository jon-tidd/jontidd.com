<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Alice's Room</title>
<meta name="robots" content="noindex, nofollow">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Young+Serif&display=swap">
<link rel="stylesheet" href="app/finds.css">
<style>
/* Layout: the room fills the screen; a paint-deck style side panel (bottom sheet on narrow screens) holds every choice. */
:root {
  --bg: #efeaee;          /* soft mauve-grey, sits behind the 3D room */
  --scene-bg: #e7e1e6;
  --panel: #fcfafb;
  --panel-2: #f3eef2;
  --ink: #2a2230;
  --ink-2: #6c6273;
  --line: #e1d8df;
  --accent: #6a4a86;      /* plum, from the lavender bedding */
  --accent-soft: #ece3f3;
  --accent-ink: #ffffff;
  --focus: #9a6cc4;
  --danger: #a93b4a;
  --ok: #2f7553;
  --warn: #9a5b12;
  --shadow: 0 10px 30px rgba(42, 26, 52, .14), 0 2px 6px rgba(42, 26, 52, .08);
  --font-display: "Young Serif", "Iowan Old Style", Georgia, serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r-sm: 6px;
  --r-md: 10px;
  --panel-w: 360px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10142a; --scene-bg: #141a33; --panel: #181d36; --panel-2: #20264280;
    --ink: #ece7f3; --ink-2: #a8a1b8; --line: #2c3352; --accent: #c7a8ea; --accent-soft: #2b2647;
    --accent-ink: #1b1530; --focus: #dcc2f7; --danger: #f08f9a; --ok: #7fd1a6; --warn: #f0b468;
    --shadow: 0 10px 30px rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10142a; --scene-bg: #141a33; --panel: #181d36; --panel-2: #20264280;
  --ink: #ece7f3; --ink-2: #a8a1b8; --line: #2c3352; --accent: #c7a8ea; --accent-soft: #2b2647;
  --accent-ink: #1b1530; --focus: #dcc2f7; --danger: #f08f9a; --ok: #7fd1a6; --warn: #f0b468;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; overflow: hidden; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button, label, input, select { touch-action: manipulation; }
/* 16px stops iOS zooming in on focus */
@media (pointer: coarse) { input[type=text], input[type=number], input:not([type]), select, select.btn, textarea, .find-input { font-size: 16px; } }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

#app { position: fixed; inset: 0; display: grid; grid-template-columns: 1fr var(--panel-w); }
#stage { position: relative; min-width: 0; overflow: hidden; background: var(--scene-bg); touch-action: none; }
#stage canvas { display: block; width: 100%; height: 100%; outline: none; }

/* Floating bars over the room */
.bar { position: absolute; display: flex; gap: 6px; align-items: center; z-index: 5; }
#viewbar { top: calc(12px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); flex-wrap: wrap; max-width: calc(100% - 24px); }
.seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; box-shadow: var(--shadow); }
.seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 999px; font-weight: 600; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.iconbtn { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; width: 36px; height: 36px; display: grid; place-items: center; box-shadow: var(--shadow); color: var(--ink); }
.iconbtn:disabled { opacity: .4; cursor: default; }
.iconbtn svg { width: 18px; height: 18px; }
#roomlabel { left: max(12px, env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-2); background: color-mix(in srgb, var(--panel) 80%, transparent); padding: 4px 9px; border-radius: 999px; pointer-events: none; }
#hint { left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); font-size: 12.5px; color: var(--ink-2); background: color-mix(in srgb, var(--panel) 88%, transparent); padding: 6px 12px; border-radius: 999px; pointer-events: none; white-space: nowrap; }

/* Measurement labels drawn over the 3D view */
#labels { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
.mlabel { position: absolute; transform: translate(-50%, -50%); font-family: var(--font-mono); font-size: 11px; font-weight: 500; padding: 2px 6px; border-radius: 4px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); white-space: nowrap; }
.mlabel.tight { background: #fff1d6; color: #7a4a00; border-color: #f0c983; }
.mlabel.bad { background: #ffe1e4; color: #8c1f2f; border-color: #f2a3ad; }

/* Selection card */
#card { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(560px, calc(100% - 24px)); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 12px 14px; z-index: 6; display: grid; gap: 10px; }
#card .head { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
#card h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 18px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#card .dims { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); white-space: nowrap; }
#card .close { margin-left: auto; border: 0; background: transparent; font-size: 20px; line-height: 1; color: var(--ink-2); padding: 2px 6px; }
#card .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
#card .warn { font-size: 12.5px; color: var(--danger); font-weight: 600; }
.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: var(--r-sm); padding: 7px 11px; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .45; cursor: default; }
.btn svg { width: 15px; height: 15px; }
.swatches { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line); padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent); }
.colorrow { display: grid; gap: 4px; margin-top: 6px; }
.colorrow .btn.mini { padding: 3px 8px; font-size: 12px; }
input[type="color"] { width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 50%; padding: 0; background: none; overflow: hidden; }
input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }

/* Side panel */
#panel { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; padding-right: env(safe-area-inset-right, 0px); }
#panel header { padding: calc(16px + env(safe-area-inset-top, 0px)) 18px 10px; display: flex; align-items: center; gap: 10px; }
#panel header h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 23px; letter-spacing: .2px; }
#panel header .sync { margin-left: auto; font-size: 11.5px; color: var(--ink-2); display: flex; align-items: center; gap: 5px; }
#panel header .sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-2); display: inline-block; }
#panel header .sync.shared i { background: var(--ok); }
#grab { display: none; }
#tabs { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--line); }
#tabs button { flex: 1; border: 0; background: transparent; padding: 10px 4px 9px; font-weight: 600; font-size: 13px; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
#tabs button svg { width: 18px; height: 18px; }
#tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
#tabpanes { flex: 1; overflow-y: auto; overscroll-behavior: contain; min-height: 0; }
.pane { padding: 14px 18px calc(28px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 20px; }
.sec { display: grid; gap: 9px; min-width: 0; }
.sec > h2 { margin: 0; font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); font-weight: 700; display: flex; align-items: center; gap: 8px; }
.sec > h2 .aside { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; }
.note { font-size: 12.5px; color: var(--ink-2); margin: 0; line-height: 1.45; }

/* Presets */
.presets { display: grid; gap: 7px; }
.preset { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: var(--r-md); padding: 9px 11px; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; align-items: center; }
.preset[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.preset b { font-family: var(--font-display); font-weight: 400; font-size: 20px; grid-row: span 2; width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; background: var(--panel-2); color: var(--accent); }
.preset span { font-weight: 600; font-size: 13px; }
.preset small { color: var(--ink-2); font-size: 12px; }

/* Paint chips: cards like a paint fan deck */
.chips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 0; overflow: hidden; text-align: left; display: grid; grid-template-rows: 38px auto; }
.chip i { display: block; }
.chip span { padding: 4px 6px 5px; font-size: 10.5px; line-height: 1.2; font-weight: 600; }
.chip span em { display: block; font-style: normal; font-family: var(--font-mono); font-weight: 400; color: var(--ink-2); font-size: 9.5px; }
.chip[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.chip.custom { display: grid; place-items: center; grid-template-rows: 1fr; min-height: 60px; position: relative; }
.chip.custom input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
.chip.custom span { text-align: center; }

.segline { display: flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 2px; }
.segline button { flex: 1; border: 0; background: transparent; padding: 6px 6px; border-radius: 4px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.segline button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

.toggles { display: grid; gap: 2px; }
.toggle { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-weight: 500; }
.toggle input { appearance: none; width: 36px; height: 21px; border-radius: 999px; background: var(--line); position: relative; flex: none; transition: background .15s; cursor: pointer; }
.toggle input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 17px; height: 17px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.toggle input:checked { background: var(--accent); }
.toggle input:checked::after { transform: translateX(15px); }
.toggle small { margin-left: auto; color: var(--ink-2); font-size: 12px; }

/* Option cards (bedding, rugs) */
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.ocard { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r-md); padding: 0; overflow: hidden; text-align: left; display: grid; grid-template-rows: 74px auto; min-width: 0; }
.ocard .pic { background: var(--panel-2) center/cover no-repeat; }
.ocard .txt { padding: 7px 9px 8px; display: grid; gap: 1px; min-width: 0; }
.ocard .txt b { font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ocard .txt small { font-size: 11px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ocard[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

/* Lists */
.list { display: grid; gap: 4px; }
.li { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: var(--r-sm); border: 1px solid transparent; min-width: 0; }
.li:hover { background: var(--panel-2); }
.li[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); }
.li .dot { width: 12px; height: 12px; border-radius: 3px; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
.li .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; text-align: left; border: 0; background: transparent; padding: 0; }
.li .meta { font-family: var(--font-mono); font-size: 11px; color: var(--ink-2); white-space: nowrap; }
.li .mini { border: 1px solid var(--line); background: var(--panel); border-radius: 5px; padding: 3px 8px; font-size: 12px; font-weight: 600; }
.empty { font-size: 12.5px; color: var(--ink-2); padding: 6px 8px; border: 1px dashed var(--line); border-radius: var(--r-sm); }

.catalog { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
.citem { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r-md); padding: 8px 9px; display: grid; grid-template-columns: 34px 1fr; gap: 2px 8px; align-items: center; text-align: left; min-width: 0; }
.citem .ic { grid-row: span 2; width: 34px; height: 34px; border-radius: 7px; background: var(--panel-2) center/cover no-repeat; }
.citem b { font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.citem small { font-size: 11px; color: var(--ink-2); font-family: var(--font-mono); }

.addfind { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: center; text-align: left; border: 1.5px dashed color-mix(in srgb, var(--accent) 55%, var(--line)); background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; }
.addfind svg { grid-row: span 2; width: 26px; height: 26px; color: var(--accent); }
.addfind b { font-size: 14px; }
.addfind small { color: var(--ink-2); font-size: 12px; }
.addfind:disabled { opacity: .5; cursor: default; }

/* Lighting */
.slider { display: grid; gap: 6px; }
.slider label { display: flex; justify-content: space-between; font-weight: 500; }
.slider label output { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.sky { height: 8px; border-radius: 4px; background: linear-gradient(90deg, #f6c79a, #cfe3ff 25%, #bcd8ff 50%, #ffd7a6 75%, #f39a6b 86%, #1d2547); }

/* Versions */
.saverow { display: flex; gap: 6px; }
.saverow input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--panel); padding: 7px 10px; }
.versions { display: grid; gap: 8px; }
.ver { display: grid; grid-template-columns: 92px 1fr; gap: 10px; border: 1px solid var(--line); border-radius: var(--r-md); padding: 7px; align-items: center; min-width: 0; }
.ver .th { width: 92px; aspect-ratio: 16 / 10; border-radius: 6px; background: var(--panel-2) center/cover no-repeat; border: 0; padding: 0; }
.ver .vi { display: grid; gap: 2px; min-width: 0; }
.ver .vi b { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ver .vi small { font-size: 11.5px; color: var(--ink-2); }
.ver .acts { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 3px; }
.confirm { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; }

/* Toasts */
#toasts { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: grid; gap: 6px; z-index: 50; pointer-events: none; }
.toast { background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 13px; box-shadow: var(--shadow); }
.toast .btn { background: var(--panel); color: var(--ink); border-color: transparent; }

/* Loading */
#loading { position: absolute; inset: 0; display: grid; place-items: center; z-index: 3; color: var(--ink-2); font-family: var(--font-display); font-size: 20px; pointer-events: none; }

/* Image preview (Save image when the viewer can't download) */
#shot { position: fixed; inset: 0; background: rgba(10, 8, 16, .6); display: grid; place-items: center; z-index: 60; padding: 20px; }
#shot figure { margin: 0; background: var(--panel); border-radius: 14px; padding: 12px; max-width: min(900px, 100%); max-height: 100%; overflow: auto; display: grid; gap: 10px; box-shadow: var(--shadow); }
#shot img { border-radius: 8px; max-height: 70vh; max-height: min(70vh, calc(100dvh - 140px)); max-width: 100%; width: auto; height: auto; }
#shot figcaption { display: flex; gap: 8px; align-items: center; justify-content: space-between; font-size: 12.5px; color: var(--ink-2); }

/* Narrow screens: panel becomes a bottom sheet */
@media (max-width: 820px), (max-aspect-ratio: 4/5) {
  #app { grid-template-columns: 1fr; grid-template-rows: 1fr; }
  #panel { position: fixed; left: 0; right: 0; bottom: 0; height: var(--sheet-h, 46%); max-height: calc(100% - 56px); border-left: 0; border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.18); z-index: 10; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); transition: height .22s ease; }
  #panel.collapsed { height: calc(118px + env(safe-area-inset-bottom, 0px)); }
  #panel header { padding: 4px 16px 6px; }
  #panel header h1 { font-size: 19px; }
  #grab { display: block; width: 100%; height: 22px; border: 0; background: transparent; position: relative; flex: none; cursor: grab; touch-action: none; }
  #grab::after { content: ""; position: absolute; left: 50%; top: 9px; width: 40px; height: 4px; border-radius: 2px; background: var(--line); transform: translateX(-50%); }
  #stage { height: 100%; }
  /* the card scrolls rather than slipping under the view bar */
  #card { bottom: calc(var(--sheet-px, 46vh) + 10px); max-height: max(96px, calc(100% - var(--sheet-px, 0px) - 64px - env(safe-area-inset-top, 0px))); overflow-y: auto; overscroll-behavior: contain; }
  #card .head { position: sticky; top: -12px; background: var(--panel); z-index: 1; }
  #roomlabel, #hint { display: none; }
  .seg button { padding: 7px 10px; font-size: 12.5px; }
}
@media (max-width: 420px) {
  .seg button .long { display: none; }
  .chips { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
</style>

    <div id="loading">Setting up the room…</div>
    <div id="labels" aria-hidden="true"></div>

      <div class="seg" role="group" aria-label="Camera view">
        <button id="view-dollhouse" data-view="dollhouse" aria-pressed="true">Dollhouse</button>

        <button id="view-window" data-view="from_window" aria-pressed="false"><span class="long">From the </span>window</button>
        <button id="view-plan" data-view="top_down" aria-pressed="false">Plan</button>
      </div>
      <button id="undo" class="iconbtn" title="Undo (Ctrl+Z)" aria-label="Undo" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button id="redo" class="iconbtn" title="Redo (Shift+Ctrl+Z)" aria-label="Redo" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      <button id="snap" class="iconbtn" title="Save image of this view" aria-label="Save image of this view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg></button>
