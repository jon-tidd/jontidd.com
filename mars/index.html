<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mars Search Map</title>
<meta name="description" content="Zoom into Mars and see where an AI scanner has searched for geometry that wind, water and impacts don't usually make, and how each flagged spot was judged.">
<meta property="og:title" content="Mars Search Map">
<meta property="og:description" content="Where the scanner has looked on Mars, what it flagged, and how each spot was judged.">
<meta property="og:image" content="https://jontidd.com/mars/figures/candidate_3013N_2387E.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --paper: #fcfbf9; --ink: #16181c; --ink-soft: #4c535e; --rule: #dcd8d1; --panel: #f4f2ee;
    --accent: #9c3a2c; --good: #2f6f52;
    --c-interesting: #c2452d; --c-uncertain: #c98a12; --c-natural: #8a8f98; --c-new: #2a78d6;
    --serif: "Newsreader", Georgia, "Times New Roman", serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #121316; --ink: #eceae6; --ink-soft: #a3a8b0; --rule: #2e3137; --panel: #1a1c20;
      --accent: #e0745f; --good: #6bbf95;
      --c-interesting: #ef6a4f; --c-uncertain: #e7ae3a; --c-natural: #9aa0a8; --c-new: #4f9cf0;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #121316; --ink: #eceae6; --ink-soft: #a3a8b0; --rule: #2e3137; --panel: #1a1c20;
    --accent: #e0745f; --good: #6bbf95;
    --c-interesting: #ef6a4f; --c-uncertain: #e7ae3a; --c-natural: #9aa0a8; --c-new: #4f9cf0;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper); color: var(--ink); font-family: var(--serif); font-size: 16px;
    display: grid; grid-template-rows: auto 1fr; overflow: hidden;
  }
  a { color: var(--accent); }
  header.bar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--rule); background: var(--paper);
  }
  header.bar .home { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-decoration: none; white-space: nowrap; }
  header.bar h1 { font-size: 20px; font-weight: 600; margin: 0; flex: 1 1 auto; }
  header.bar .stat { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); }
  main { display: grid; grid-template-columns: 1fr 380px; min-height: 0; }
  #map { min-height: 0; background: #000; }
  aside {
    border-left: 1px solid var(--rule); background: var(--paper);
    overflow-y: auto; min-height: 0; padding: 16px;
  }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip {
    font-family: var(--mono); font-size: 12px; border: 1px solid var(--rule); background: var(--panel);
    color: var(--ink); border-radius: 999px; padding: 5px 10px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center;
  }
  .chip[aria-pressed="false"] { opacity: .45; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 1.5px solid rgba(0,0,0,.35); }
  select { font-family: var(--mono); font-size: 12px; background: var(--panel); color: var(--ink); border: 1px solid var(--rule); border-radius: 6px; padding: 5px 8px; max-width: 100%; }
  .note { font-size: 14px; color: var(--ink-soft); line-height: 1.45; margin: 10px 0 14px; }
  .list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
  .list li { border-bottom: 1px solid var(--rule); }
  .list button {
    all: unset; box-sizing: border-box; width: 100%; padding: 9px 2px; cursor: pointer;
    display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; align-items: center; font-size: 15px;
  }
  .list button:hover, .list button:focus-visible { background: var(--panel); }
  .list .sub { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); }
  .list .sc { font-family: var(--mono); font-size: 13px; }
  .detail h2 { font-size: 22px; margin: 4px 0 2px; font-weight: 600; }
  .detail .where { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); }
  .detail img { width: 100%; border-radius: 8px; margin: 12px 0 4px; display: block; background: var(--panel); }
  .detail .cap { font-size: 12px; color: var(--ink-soft); font-family: var(--mono); }
  .detail h3 { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 18px 0 6px; }
  .detail dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 15px; }
  .detail dt { color: var(--ink-soft); }
  .detail dd { margin: 0; }
  .pill { font-family: var(--mono); font-size: 12px; border-radius: 999px; padding: 3px 9px; color: #fff; display: inline-block; margin-top: 8px; }
  .back { all: unset; cursor: pointer; font-family: var(--mono); font-size: 12px; color: var(--accent); }
  .links a { display: inline-block; margin: 4px 14px 0 0; font-size: 15px; }
  .sens-h { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 14px 0 6px; }
  .sens { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0; font-size: 14px; line-height: 1.4; }
  .sens dt { color: var(--ink-soft); }
  .sens dd { margin: 0; }
  .sens .sub { font-family: var(--mono); font-size: 11px; }
  .skeptic { background: var(--panel); border-radius: 8px; padding: 10px 12px; font-size: 15px; line-height: 1.45; }
  .leaflet-container { font-family: var(--serif); background: #000; }
  .leaflet-control-attribution { font-size: 10px; }
  .loading { position: absolute; inset: 0; display: grid; place-items: center; color: #ddd; font-family: var(--mono); font-size: 13px; pointer-events: none; z-index: 500; }
  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr 42%; }
    aside { border-left: 0; border-top: 1px solid var(--rule); }
    header.bar .stat { width: 100%; }
    header.bar h1 { font-size: 18px; }
  }
</style>
</head>
<body>
<header class="bar">
  <a class="home" href="/">&larr; JONTIDD.COM</a>
  <h1>Mars Search map</h1>
  <span class="stat" id="stat">Loading&hellip;</span>
  <a class="home" href="/mars/writeup">READ THE WRITE-UP &rarr;</a>
</header>
<main>
  <div id="map" style="position:relative"><div class="loading" id="loading">Loading Mars&hellip;</div></div>
  <aside id="side" aria-live="polite"></aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function () {
  "use strict";

  // The Murray Lab CTX mosaic, served by Esri as geographic (lat/lon) tiles:
  // 2 x 1 tiles of 512 px at level 0, native to level 13 (~5 m/px).
  var CTX = "https://astro.arcgis.com/arcgis/rest/services/OnMars/CTX1/MapServer/tile/{z}/{y}/{x}";
  var MarsGeo = L.extend({}, L.CRS.Earth, {
    code: "MARS:GEO",
    projection: L.Projection.LonLat,
    transformation: new L.Transformation(1 / 360, 0.5, -1 / 360, 0.25),
    scale: function (z) { return 1024 * Math.pow(2, z); },
    zoom: function (s) { return Math.log(s / 1024) / Math.LN2; },
    infinite: false,
    wrapLng: [-180, 180],
    R: 3396190
  });

  var LABELS = {
    interesting: { name: "Interesting", color: "var(--c-interesting)" },
    uncertain:   { name: "Maybe",       color: "var(--c-uncertain)" },
    natural:     { name: "Natural",     color: "var(--c-natural)" },
    none:        { name: "Not reviewed yet", color: "var(--c-new)" }
  };
  var RUNS = {
    sabaea: "Terra Sabaea, CTX sweep",
    hirise_sabaea: "Terra Sabaea, HiRISE sweep",
    cydonia: "Cydonia, CTX",
    sabaea_peek: "Terra Sabaea, first look",
    moc_corridor: "Reference-image corridor"
  };
  var PARTS = {
    seg_ortho: "straight edges meeting at right angles",
    seg_ortho_3x3: "right-angle edges across the neighbourhood",
    ortho: "two edge directions 90° apart",
    ortho_3x3: "right-angle edge families nearby",
    ortho_5x5: "right-angle edge families, wide area",
    corners: "corners where long edges meet",
    corners_3x3: "corners across the neighbourhood",
    parallel: "parallel edges",
    straight: "long straight edges",
    aniso: "one strongly dominant direction",
    aniso_3x3: "dominant direction nearby",
    edge_energy: "edge density"
  };

  var css = getComputedStyle(document.documentElement);
  function colorOf(label) {
    var v = LABELS[label || "none"].color.replace(/^var\((--[^)]+)\)$/, "$1");
    return css.getPropertyValue(v).trim() || "#888";
  }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function fmt(n) { return Math.round(n).toLocaleString("en-US"); }
  function ll(c) {
    return Math.abs(c.lat).toFixed(3) + "°" + (c.lat >= 0 ? "N" : "S") + " " +
           Math.abs(c.lon).toFixed(3) + "°" + (c.lon >= 0 ? "E" : "W");
  }

  var map = L.map("map", {
    crs: MarsGeo, center: [32, 12], zoom: 2, minZoom: 0, maxZoom: 15,
    maxBounds: [[-95, -200], [95, 200]], worldCopyJump: false, zoomControl: true
  });
  var base = L.tileLayer(CTX, {
    tileSize: 512, maxNativeZoom: 13, maxZoom: 15, noWrap: true,
    bounds: [[-90, -180], [90, 180]],
    attribution: 'CTX mosaic: NASA/JPL/MSSS, <a href="https://murray-lab.caltech.edu/CTX/">Caltech Murray Lab</a>; tiles via Esri'
  }).addTo(map);
  var loadingEl = document.getElementById("loading");
  base.once("load", function () { loadingEl.remove(); });
  base.on("tileerror", function () {
    if (loadingEl.isConnected) loadingEl.textContent = "Some imagery tiles failed to load";
  });

  var coverLayer = L.layerGroup().addTo(map);
  var pinLayer = L.layerGroup().addTo(map);
  var state = { data: null, show: { interesting: true, uncertain: true, natural: false, none: true },
                run: "all", selected: null, markers: {} };
  var side = document.getElementById("side");

  function drawCoverage(cov) {
    var stroke = css.getPropertyValue("--c-new").trim() || "#2a78d6";
    cov.forEach(function (c) {
      var style = { color: stroke, weight: 1, fillOpacity: 0.08, opacity: 0.7, interactive: false };
      if (c.strips && c.strips.length) {
        c.strips.forEach(function (s) {
          L.rectangle([[s[0], s[1]], [s[0] + c.cell_deg, s[2]]],
                      L.extend({}, style, { weight: 0, fillOpacity: 0.18 })).addTo(coverLayer);
        });
        return;
      }
      // Only a bounding box was exported: draw it when the scan fills most of it.
      var b = c.bbox, mid = (b[1] + b[3]) / 2 * Math.PI / 180;
      var boxKm2 = (b[2] - b[0]) * (b[3] - b[1]) * 59274 * 59274 / 1e6 * Math.cos(mid);
      if (boxKm2 > 0 && c.km2 / boxKm2 > 0.01) {   // skip scattered spot-checks
        L.rectangle([[b[1], b[0]], [b[3], b[2]]], L.extend({}, style, { dashArray: "4 4" }))
          .addTo(coverLayer);
      }
    });
  }

  function visible() {
    return state.data.candidates.filter(function (c) {
      return state.show[c.label || "none"] && (state.run === "all" || c.run === state.run);
    });
  }

  function drawPins() {
    pinLayer.clearLayers();
    state.markers = {};
    visible().slice().sort(function (a, b) {
      var o = { natural: 0, none: 1, uncertain: 2, interesting: 3 };
      return o[a.label || "none"] - o[b.label || "none"];
    }).forEach(function (c) {
      var m = L.circleMarker([c.lat, c.lon], {
        radius: c.label === "interesting" ? 8 : 6, weight: 1.5, color: "#000",
        fillColor: colorOf(c.label), fillOpacity: 0.95
      }).addTo(pinLayer);
      m.bindTooltip("#" + c.rank + " " + (RUNS[c.run] || c.run), { direction: "top" });
      m.on("click", function () { select(c.id, false); });
      state.markers[c.id] = m;
    });
  }

  function filtersHTML() {
    var runs = {};
    state.data.candidates.forEach(function (c) { runs[c.run] = (runs[c.run] || 0) + 1; });
    var counts = {};
    state.data.candidates.forEach(function (c) {
      if (state.run === "all" || c.run === state.run) {
        var k = c.label || "none"; counts[k] = (counts[k] || 0) + 1;
      }
    });
    var h = '<div class="filters" role="group" aria-label="Show by label">';
    ["interesting", "uncertain", "none", "natural"].forEach(function (k) {
      h += '<button class="chip" data-label="' + k + '" aria-pressed="' + state.show[k] + '">' +
           '<span class="dot" style="background:' + colorOf(k === "none" ? null : k) + '"></span>' +
           LABELS[k].name + " " + (counts[k] || 0) + "</button>";
    });
    h += '</div><select id="run" aria-label="Which scan"><option value="all">All scans</option>';
    Object.keys(runs).forEach(function (r) {
      h += '<option value="' + esc(r) + '"' + (state.run === r ? " selected" : "") + ">" +
           esc(RUNS[r] || r) + " (" + runs[r] + ")</option>";
    });
    return h + "</select>";
  }

  function renderList() {
    var v = visible().sort(function (a, b) { return (b.final || 0) - (a.final || 0); });
    var h = filtersHTML() +
      '<p class="note">Each pin is a spot the scanner found unusually rectilinear compared with its ' +
      "surroundings. Colour is Jon's verdict after looking. Almost all of it is geology; that is " +
      "the expected answer, and the map shows the searching, not a discovery. " +
      "Blue shading or outlines mark the regions scanned so far.</p>" + sensitivityHTML() +
      '<ul class="list">';
    v.slice(0, 200).forEach(function (c) {
      h += '<li><button data-id="' + esc(c.id) + '"><span class="dot" style="background:' +
           colorOf(c.label) + '"></span><span>#' + c.rank + " " + esc(RUNS[c.run] || c.run) +
           '<br><span class="sub">' + ll(c) + '</span></span><span class="sc">' +
           (c.final != null ? c.final.toFixed(1) : "") + "</span></button></li>";
    });
    h += "</ul>";
    if (!v.length) h += '<p class="note">Nothing matches these filters.</p>';
    side.className = "";
    side.innerHTML = h;
    side.scrollTop = 0;
  }

  // What each scanned layer could have found: planted-shape recall at the depth
  // the short list was reviewed (marshunt/limits.py).  An area figure alone
  // says nothing about what would have been missed.
  function sensitivityHTML() {
    var s = state.data && state.data.sensitivity;
    if (!s || !s.layers || !s.layers.length) return "";
    var h = '<h3 class="sens-h">What this search could have found</h3><dl class="sens">';
    s.layers.forEach(function (L) {
      var r = L.recall_all, line;
      if (!r) { line = "not measured"; }
      else {
        line = r.k + " of " + r.n + " planted weathered shapes would have reached review" +
          (L.sensitive ? (L.upper_limit_count_all ? ": fewer than about " + fmt(L.upper_limit_count_all) +
                          " such structures in this area" : "")
                       : ": no measurable sensitivity to them");
        (L.other_strengths || []).forEach(function (o) {
          line += "; " + o.k + " of " + o.n + " if " + esc(o.strength) +
                  (o.upper_limit_count ? " (fewer than about " + fmt(o.upper_limit_count) + ")" : "");
        });
      }
      h += "<dt>" + esc(L.name.split(",")[0]) + "<br><span class=\"sub\">" + fmt(L.km2) + " km²</span></dt><dd>" +
           line + "</dd>";
    });
    var nI = 0, nU = 0;
    state.data.candidates.forEach(function (c) { if (c.label === "interesting") nI++; else if (c.label === "uncertain") nU++; });
    h += "</dl><p class=\"note\">Limits hold only once every flagged spot is resolved as natural; " +
         nI + " pins marked interesting and " + nU + " marked maybe are still open. " +
         "Planted shapes are assumptions about what a ruin would look like.</p>";
    return h;
  }

  function renderDetail(c) {
    var lab = c.label || "none";
    var h = '<button class="back" id="back">&larr; All spots</button>' +
      "<h2>#" + c.rank + " &middot; " + esc(RUNS[c.run] || c.run) + "</h2>" +
      '<div class="where">' + ll(c) + " &middot; cell " + c.cell_km + " km &middot; " +
      esc(c.source === "hirise" ? "HiRISE " + c.obs : "CTX mosaic") + "</div>" +
      '<span class="pill" style="background:' + colorOf(c.label) + '">' +
      (lab === "none" ? "Not reviewed yet" : "Jon's verdict: " + LABELS[lab].name) + "</span>";
    if (c.chip) {
      h += '<img alt="Orbital image centred on this spot" src="/mars/chips/' + encodeURIComponent(c.id) +
           '.jpg"><div class="cap">Centre third = the scored cell. North up.</div>';
    }
    h += "<h3>Why it was flagged</h3><dl>";
    Object.keys(c.parts || {}).forEach(function (k) {
      h += "<dt>" + c.parts[k].toFixed(1) + "σ</dt><dd>" + esc(PARTS[k] || k) + "</dd>";
    });
    h += "<dt>score</dt><dd>" + (c.score != null ? c.score.toFixed(1) : "?") +
         (c.final != null && c.final !== c.score ? " &rarr; " + c.final.toFixed(1) + " after checks" : "") +
         "</dd></dl>";
    var ev = [];
    if (c.dtm) {
      ev.push("<dt>Terrain</dt><dd>" + esc(c.dtm.kind === "hirise_dtm" ? "HiRISE" : c.dtm.kind === "ctx_dtm" ? "CTX" : c.dtm.kind) +
              " elevation model: " + c.dtm.relief_m + " m relief, " + c.dtm.slope_deg + "° slope" +
              (c.dtm.slope_control != null ? "; " + Math.round(c.dtm.slope_control * 100) + "% of edges just follow the slope" : "") + "</dd>");
    }
    if (c.shadows) {
      ev.push("<dt>Shadows</dt><dd>" + c.shadows.n_shadows + " measured, up to " + c.shadows.max_height_m +
              " m tall</dd>");
    }
    if (c.crater_rim && c.crater_rim.on_rim) {
      ev.push("<dt>Crater</dt><dd>On a crater rim" + (c.crater_rim.catalogue_d_km ? " (catalogued, " +
              c.crater_rim.catalogue_d_km + " km across)" : " (seen in the image)") + ": the commonest natural source of straight edges</dd>");
    }
    if (c.mosaic_seam) {
      ev.push("<dt>Mosaic seam</dt><dd>Two source images meet at this cell</dd>");
    }
    if (c.persistence != null) {
      ev.push("<dt>Second looks</dt><dd>" + Math.round(c.persistence * 100) + "% of " + c.second_looks +
              " other images agree</dd>");
    }
    if (ev.length) h += "<h3>Checks</h3><dl>" + ev.join("") + "</dl>";
    if (c.skeptic) {
      var s = c.skeptic;
      h += "<h3>Sceptic review</h3><div class=\"skeptic\"><b>" + esc(s.landform_class) + "</b> (" +
           esc(s.explanation_kind) + ", " + esc(s.confidence) + " confidence)<br>" + esc(s.explanation) +
           (s.does_not_fit ? "<br><i>Doesn't fit: " + esc(s.does_not_fit) + "</i>" : "") +
           "<br>Would refute it: " + esc(s.would_refute) + "</div>";
    }
    h += '<h3>Look for yourself</h3><div class="links">' +
         '<a target="_blank" rel="noopener" href="https://trek.nasa.gov/mars/#v=0.1&x=' + c.lon.toFixed(4) +
         "&y=" + c.lat.toFixed(4) + '&z=9">NASA Mars Trek</a>' +
         (c.source === "hirise" ? '<a target="_blank" rel="noopener" href="https://www.uahirise.org/' +
           encodeURIComponent(c.obs.replace(/_RED$/, "")) + '">HiRISE page</a>' : "") +
         '<a href="#' + encodeURIComponent(c.id) + '">Link to this spot</a></div>';
    side.className = "detail";
    side.innerHTML = h;
    side.scrollTop = 0;
  }

  function select(id, fly) {
    var c = state.data.candidates.find(function (x) { return x.id === id; });
    if (!c) return;
    state.selected = id;
    if (location.hash.slice(1) !== id) history.replaceState(null, "", "#" + encodeURIComponent(id));
    renderDetail(c);
    if (fly) map.flyTo([c.lat, c.lon], Math.max(map.getZoom(), 10), { duration: 0.8 });
    var m = state.markers[id];
    if (m) m.bringToFront();
  }

  side.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    if (b.id === "back") {
      state.selected = null;
      history.replaceState(null, "", location.pathname);
      renderList();
    } else if (b.dataset.label) {
      state.show[b.dataset.label] = !state.show[b.dataset.label];
      drawPins(); renderList();
    } else if (b.dataset.id) {
      select(b.dataset.id, true);
    }
  });
  side.addEventListener("change", function (e) {
    if (e.target.id === "run") {
      state.run = e.target.value;
      drawPins(); renderList();
      var v = visible();
      if (v.length) map.flyToBounds(L.latLngBounds(v.map(function (c) { return [c.lat, c.lon]; })).pad(0.3),
                                    { maxZoom: 9, duration: 0.8 });
    }
  });

  fetch("/mars/data.json", { cache: "no-cache" }).then(function (r) {
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }).then(function (d) {
    state.data = d;
    var km = 0;
    Object.keys(d.scanned_km2 || {}).forEach(function (k) { km += d.scanned_km2[k]; });
    document.getElementById("stat").textContent =
      fmt(km) + " km² scanned (" + (100 * km / d.mars_km2).toFixed(2) + "% of Mars) · " +
      d.candidates.length + " spots flagged · updated " + d.generated.slice(0, 10);
    drawCoverage(d.coverage || []);
    drawPins();
    var want = decodeURIComponent(location.hash.slice(1));
    if (want && d.candidates.some(function (c) { return c.id === want; })) {
      var c = d.candidates.find(function (x) { return x.id === want; });
      if (!state.show[c.label || "none"]) { state.show[c.label || "none"] = true; drawPins(); }
      map.setView([c.lat, c.lon], 10);
      select(want, false);
    } else {
      renderList();
    }
  }).catch(function (e) {
    side.innerHTML = '<p class="note">Could not load the scan data (' + esc(e.message) + ").</p>";
    document.getElementById("stat").textContent = "";
  });
})();
</script>
</body>
</html>
